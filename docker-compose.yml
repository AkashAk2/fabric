version: '3.8'

services:
  fabric-api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./ENV:/root/.config/fabric/.env:ro
    environment:
      - GIN_MODE=release

  agno:
    build: ./services/agno_service
    ports: ["9000:9000"]
    env_file: ./services/agno_service/.env
    volumes:
      - ./services/agno_service:/app
    restart: unless-stopped 